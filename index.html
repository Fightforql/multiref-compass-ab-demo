<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MultiRef · A/B 19-case 对比</title><link rel="stylesheet" href="./styles.css"></head>
<body><aside><a class="brand" href="./">MultiRef<span>COMPASS / CASE REVIEW</span></a><div class="overview"><b>19</b><span>多主体 cases<br><small><span id="ready-counts">正在读取 A/B 进度</span></small></span></div><label class="search">搜索 case<input id="search" placeholder="输入编号，如 007" autocomplete="off"></label><nav id="cases" aria-label="案例列表"></nav><div class="sidebar-foot">参考图 → 主体身份<br>Proxy → 空间与时间控制</div></aside>
<main><div id="loading">正在加载案例…</div><section id="detail" hidden><header><div><p class="eyebrow">MULTI-SUBJECT REFERENCE REVIEW</p><h1 id="title"></h1><p id="note" class="note"></p></div><div class="pager"><button id="prev" aria-label="上一个 case">←</button><span id="position"></span><button id="next" aria-label="下一个 case">→</button></div></header>
<section class="panel"><div class="section-heading"><h2>参考图 <span>References</span></h2><span class="hint">点击查看大图</span></div><div id="refs" class="refs"></div><div id="bindings" class="bindings"></div></section>
<section class="panel"><div class="section-heading"><h2>视频对照 <span>Video / Proxy</span></h2><div class="controls"><button id="play">同步播放</button><button id="reset">回到开头</button><label><input id="sync" type="checkbox" checked>同步进度</label></div></div><div class="videos"><figure><div class="video-title">原视频 <span>Seedance 原始生成 · 含原声</span></div><video id="source" controls playsinline preload="metadata"></video><a id="download-source" download>下载参考视频 ↗</a></figure><figure><div class="video-title">Identity proxy <span id="proxy-version"></span></div><video id="proxy" controls muted playsinline preload="metadata"></video><a id="download-proxy" download>下载原始 proxy ↗</a></figure></div><p class="hint">参考视频可通过播放器右下角调整音量；proxy 只提供视觉控制，不含音轨。</p><details id="h3-section" open hidden><summary>H3 输出与对应输入 caption · A / B 对比</summary><video id="h3" hidden controls playsinline preload="none"></video><div id="h3-comparison" class="videos"></div></details></section>
<section class="panel"><div class="section-heading"><h2>Caption</h2><div class="controls"><select id="caption-version" aria-label="caption 版本"><option value="caption">当前版本</option><option value="original_caption">不显式绑定颜色（A）</option><option value="original_prompt">原始生成 prompt</option></select><button id="copy">复制全文</button><button id="download-caption">下载 TXT</button></div></div><pre id="caption"></pre></section><footer>所有案例均只读展示。本轮共 19 个 case，分别测试不绑定颜色与显式颜色绑定两版 caption。</footer></section></main>
<dialog id="image-dialog"><button id="close-image" aria-label="关闭大图">关闭 ×</button><img id="large-image" alt="参考图大图"></dialog><div id="toast" role="status"></div><script src="./app.js"></script></body></html>
